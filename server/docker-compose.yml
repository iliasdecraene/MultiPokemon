services:
  yellowlink:
    build: .
    # A second server (another group of friends) on the same machine: copy the repo to another folder and set
    # YL_NAME, YL_HOST_PORT and COMPOSE_PROJECT_NAME in its .env (see DEPLOY.md "A second group").
    container_name: ${YL_NAME:-yellowlink}
    restart: unless-stopped
    ports:
      - "${YL_HOST_PORT:-8765}:8765"
    environment:
      # Room password every player types into the client. Set it in a .env file
      # next to this file (YL_KEY=something-secret) or replace the default below.
      YL_KEY: ${YL_KEY:-change-me}
      YL_PORT: "8765"
      # Optional: the server's name players see (sidebar + welcome) and the welcome message.
      YL_SERVER_NAME: ${YL_SERVER_NAME:-}
      YL_MOTD: ${YL_MOTD:-}
      # Optional: after merging this server into another one, forward players there (see DEPLOY.md "Merging").
      YL_MOVED_TO: ${YL_MOVED_TO:-}
      YL_MOVED_KEY: ${YL_MOVED_KEY:-}
    volumes:
      # players.json (and optionally config.json) live here on the host.
      - ./data:/data
